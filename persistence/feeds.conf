# OneKVM release tooling writes a signed, architecture-specific feed here.
# External OpenWrt or third-party IPK feeds are not ABI-compatible.
#
# Same-version layout (published by `make feed` in onekvm-distro):
#   https://updates.onekvm.org/<product>/<system_version>/<arch>
# Example for NanoKVM 0.2.0 (system/default → /etc/opkg/onekvm-feed.conf):
#   Prefer `src` (Packages) over `src/gz` when a CDN may cache Packages.gz
#   independently of Packages.asc — otherwise opkg reports Bad signature.
#   src onekvm-metadata https://updates.onekvm.org/nanokvm/0.2.0/all
#   src onekvm-main https://updates.onekvm.org/nanokvm/0.2.0/main
#   src onekvm-onekvm https://updates.onekvm.org/nanokvm/0.2.0/onekvm
#   src onekvm-extensions https://updates.onekvm.org/nanokvm/0.2.0/onekvm-extensions
#
# Marketplace custom sources are one file each:
#   /etc/opkg/onekvm-ext-{name}.conf
#
# Crossing system_version may involve kernel/ABI changes. Do not retarget this
# file across versions by hand; the planned onekvm-upgrade package performs the
# RAUC/kernel jump and then points the device at the new feed. See
# docs/package-feeds.md.
